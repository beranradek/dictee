[package]
name = "dictee"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", features = ["global_shortcuts"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
hound = "3.5.1"
libadwaita = { version = "0.9.2", features = ["v1_4"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }
whisper-rs = "0.16.0"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
